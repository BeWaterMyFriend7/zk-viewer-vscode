name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（不带 v 前缀），例如 0.2.0'
        required: true
        default: '0.2.0'
  push:
    tags: ['*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static checks
        run: |
          npm run compile
          npm run lint
          npm run format:check
      - name: Unit tests
        run: npm run test:unit
      - name: Performance tests
        run: npm run test:perf
      - name: Integration tests (headless)
        run: xvfb-run -a npm run test:integration
      - name: Build VSIX
        run: npm run package
      - name: Verify VSIX contents
        run: |
          # VSIX 是 ZIP 格式，Ubuntu 的 GNU tar 无法读取，使用 unzip 校验。
          unzip -l dist/zk-viewer-vscode.vsix | grep -E 'extension/package.json|extension/out/src/extension.js|extension/media/detail.js'
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: zk-viewer-vscode-vsix
          path: dist/zk-viewer-vscode.vsix
          if-no-files-found: error
      - name: Prepare release notes
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${INPUT_VERSION#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::发布版本必须使用 x.y.z 格式且不带 v 前缀，当前值：$VERSION"
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "::error::发布版本 $VERSION 与 package.json 版本 $PACKAGE_VERSION 不一致"
            exit 1
          fi

          if ! grep -Fxq "## $VERSION" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 中缺少版本章节：## $VERSION"
            exit 1
          fi

          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md

          if [[ ! -s dist/release-notes.md ]]; then
            echo "::error::CHANGELOG.md 的 $VERSION 版本说明为空"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "tag=$VERSION" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "zk-viewer-vscode $version" \
              --notes-file dist/release-notes.md
            gh release upload "$tag" dist/zk-viewer-vscode.vsix --clobber
          else
            gh release create "$tag" dist/zk-viewer-vscode.vsix \
              --target "$GITHUB_SHA" \
              --title "zk-viewer-vscode $version" \
              --notes-file dist/release-notes.md
          fi
