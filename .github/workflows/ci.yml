name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:perf

  integration:
    name: Integration tests (Linux, headless)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache VS Code test download
        uses: actions/cache@v4
        with:
          # Cache only the VS Code binary directory (not user-data, which
          # carries per-run lock files that can break the next run).
          path: .vscode-test/vscode-*
          key: ${{ runner.os }}-vscode-test-1.60.0
      - name: Integration tests (headless)
        run: xvfb-run -a npm run test:integration
